name: Django CI

on:
  push:
    branches: [main]
    paths: ["samples/django-app/**", ".github/workflows/django-ci.yml"]
  pull_request:
    paths: ["samples/django-app/**", ".github/workflows/django-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/django-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: samples/django-app/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test -v2
