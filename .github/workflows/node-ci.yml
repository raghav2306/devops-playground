name: Node.js CI

on:
  push:
    branches: [main]
    paths:
      - "samples/node-ts-express-ec2/**"
      - "ci-cd/jenkins-sonarqube-docker/**"
      - ".github/workflows/node-ci.yml"
  pull_request:
    paths:
      - "samples/node-ts-express-ec2/**"
      - "ci-cd/jenkins-sonarqube-docker/**"
      - ".github/workflows/node-ci.yml"

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [samples/node-ts-express-ec2, ci-cd/jenkins-sonarqube-docker]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
